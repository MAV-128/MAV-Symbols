ShortDescription: Lightweight plain-text editor for Windows with smart encoding detection
Description: |
  MAV Symbols is a classic plain-text editor for Windows 10/11. It reliably detects encodings
  (including Cyrillic and CJK), warns you before any character is lost, saves files atomically,
  and brings your unsaved text back after a crash.
