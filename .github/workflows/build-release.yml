name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build Release
      run: |
        msbuild "MAV Symbols.sln" /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild
    
    - name: Install Inno Setup
      run: |
        $installer = "$env:TEMP\is-setup.exe"
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $installer -UseBasicParsing
        Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/NORESTART","/DIR=C:\InnoSetup" -Wait -NoNewWindow
    
    - name: Build Installer
      run: |
        & "C:\InnoSetup\ISCC.exe" MAVSymbols.iss
      shell: pwsh
    
    - name: Upload Installer to Release
      uses: softprops/action-gh-release@v2
      with:
        files: output/MAVSymbols-1.0-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}