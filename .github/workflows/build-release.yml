name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build Release
      run: |
        msbuild "MAV Symbols.sln" /p:Configuration=Release /p:Platform="Any CPU" /t:Rebuild
    
    - name: Setup Inno Setup
      uses: crazy-max/ghaction-innosetup@v3
      with:
        install-dir: C:\Program Files (x86)\Inno Setup 7
    
    - name: Build Installer
      run: |
        iscc MAVSymbols.iss
    
    - name: Upload Installer to Release
      uses: softprops/action-gh-release@v2
      with:
        files: output/MAVSymbols-1.0-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}